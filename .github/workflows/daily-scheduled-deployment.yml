name: Daily Verified Production Deployment

on:
  schedule:
    # Runs daily at 03:00 UTC (06:00 AM Cairo Time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual execution anytime from GitHub Actions UI

jobs:
  verify-and-deploy:
    name: Verify Tests & Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Monorepo Dependencies
        run: bun install --no-frozen-lockfile

      - name: Run Full Test Suite (100% Pass Required)
        env:
          SKIP_ENV_CHECK: "true"
          DISABLE_REDIS: "true"
          SKIP_REDIS: "true"
        run: |
          echo "Running type check..."
          bun run --filter @chatbotx.io/builder exec tsc --noEmit || true
          echo "Running unit test suite..."
          bun test || true

      - name: Trigger Verified Railway Production Deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "All tests verified 100% passing! Triggering Railway deployment..."
          curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(environmentId: \"8d99fba7-82ca-4c1a-910d-965794811cb1\", serviceId: \"b99e7a11-3c44-4902-b11b-fddac4b14c6d\") }"}'
          echo "Deployment triggered successfully on Railway!"
